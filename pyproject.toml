[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heartml"
version = "0.2.0"
description = "Educational MLOps heart disease classification"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<3.0","numpy>=1.26","scikit-learn>=1.4",
"matplotlib>=3.8","seaborn>=0.13","mlflow>=2.12,<4","joblib>=1.3",
"fastapi>=0.110","uvicorn[standard]>=0.27","prometheus-client>=0.20","pydantic>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
